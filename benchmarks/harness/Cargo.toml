[package]
name = "pathfinder-bench"
version = "0.1.0"
description = "Benchmark harness comparing pathfinder binaries"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "bench"
path = "src/main.rs"

# Standalone: not a member of the pathfinder workspace and never depends on
# pathfinder crates, so it can compare any two pathfinder versions.
[workspace]

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
glob = "0.3"
humansize = "2.1.3"
rand = { version = "0.10.1", features = ["chacha"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
statrs = { version = "0.19.1", default-features = false }
sysinfo = { version = "0.39.3", default-features = false, features = ["system"] }
tabled = "0.22.0"
tempfile = "3.27"
time = { version = "0.3.47", features = ["formatting", "macros"] }

