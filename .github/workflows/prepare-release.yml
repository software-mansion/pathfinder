name: Prepare release

permissions:
  contents: read

on:
  push:
    tags:
      - v[0-9]+.*

jobs:
    verify-release:
        name: Verify release metadata
        runs-on: ubuntu-latest
        permissions:
          contents: read
        steps:
            - uses: actions/checkout@v5
            - name: Verify tag, Cargo version, and changelog
              run: |
                set -euo pipefail

                # 1. Get the version from the git tag (e.g., v1.2.3 -> 1.2.3)
                tag_version="${GITHUB_REF_NAME#v}"

                # 2. Extract Pathfinder's version from Cargo metadata.
                if ! cargo_version="$(cargo metadata --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "pathfinder").version')"; then
                  echo "::error::Could not read Pathfinder version from Cargo metadata"
                  exit 1
                fi

                if [ "$tag_version" != "$cargo_version" ]; then
                  echo "::error::Tag version ($tag_version) does not match Cargo.toml version ($cargo_version)"
                  exit 1
                fi

                # 3. Check that the changelog contains an entry for the release.
                if ! grep -Fq "## [$tag_version] - " CHANGELOG.md; then
                  echo "::error::CHANGELOG.md has no release entry for $tag_version"
                  exit 1
                fi

    build-binaries:
        needs: verify-release
        strategy:
            matrix:
              include:
                - target: x86_64-unknown-linux-gnu
                  os: ubuntu-22.04
                - target: aarch64-unknown-linux-gnu
                  os: ubuntu-22.04-arm
                - target: x86_64-apple-darwin
                  os: macos-15-intel
                - target: aarch64-apple-darwin
                  os: macos-latest
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v5
            - uses: arduino/setup-protoc@v3
              with:
                repo-token: ${{ secrets.GITHUB_TOKEN }}
            - name: Build release archive
              id: build
              uses: taiki-e/upload-rust-binary-action@v1
              with:
                bin: pathfinder
                target: ${{ matrix.target }}
                profile: release-lto
                # Build the archive without publishing it so smoke tests can run first.
                dry-run: true
                dry-run-intended: true
            - name: Store release archive
              uses: actions/upload-artifact@v7
              with:
                name: release-${{ matrix.target }}
                path: ${{ steps.build.outputs.tar }}
                if-no-files-found: error
                # Artifacts are only needed for the next job, so we can delete them after 1 day.
                retention-days: 1

    test-binaries:
        needs: build-binaries
        uses: ./.github/workflows/_test-binaries.yml
        with:
          release_tag: ${{ github.ref_name }}

    build-and-test-docker:
        needs: verify-release
        uses: ./.github/workflows/_build-and-test-docker.yml
        with:
          pathfinder_force_version: ${{ github.ref_name }}
        secrets:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

    create-draft-release:
        needs: [test-binaries, build-and-test-docker]
        runs-on: ubuntu-latest
        permissions:
          contents: write
        steps:
            - uses: actions/checkout@v5
            - uses: taiki-e/create-gh-release-action@v1
              with:
                changelog: CHANGELOG.md
                draft: true
                token: ${{ secrets.GITHUB_TOKEN }}

    upload-assets:
        needs: create-draft-release
        runs-on: ubuntu-latest
        permissions:
          contents: write
        steps:
            - name: Download tested archives
              uses: actions/download-artifact@v8
              with:
                pattern: release-*
                path: artifacts
                merge-multiple: true
            - name: Upload archives to draft release
              env:
                GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                GH_REPO: ${{ github.repository }}
              # Allow reruns to replace assets already uploaded to the draft release.
              run: gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
