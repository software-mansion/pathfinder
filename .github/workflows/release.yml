name: Release

permissions:
  contents: read

on:
  push:
    tags:
      - v[0-9]+.*

jobs:
    verify-release:
        name: Verify release metadata
        runs-on: ubuntu-latest
        permissions:
          contents: read
        steps:
            - uses: actions/checkout@v5
            - name: Verify tag, Cargo version, and changelog
              run: |
                set -euo pipefail

                # The tag, workspace version, and changelog must describe the same release.
                tag_version="${GITHUB_REF_NAME#v}"
                cargo_version="$(awk '
                  $0 == "[workspace.package]" { in_workspace_package = 1; next }
                  /^\[/ { in_workspace_package = 0 }
                  in_workspace_package && $1 == "version" {
                    gsub(/"/, "", $3)
                    print $3
                    exit
                  }
                ' Cargo.toml)"

                if [ -z "$cargo_version" ]; then
                  echo "::error::Could not read workspace version from Cargo.toml"
                  exit 1
                fi

                if [ "$tag_version" != "$cargo_version" ]; then
                  echo "::error::Tag version ($tag_version) does not match Cargo.toml version ($cargo_version)"
                  exit 1
                fi

                if ! awk -v prefix="## [$tag_version] - " 'index($0, prefix) == 1 { found = 1 } END { exit !found }' CHANGELOG.md; then
                  echo "::error::CHANGELOG.md has no release entry for $tag_version"
                  exit 1
                fi

    build-binaries:
        needs: verify-release
        strategy:
            matrix:
              include:
                - target: x86_64-unknown-linux-gnu
                  os: ubuntu-22.04
                - target: aarch64-unknown-linux-gnu
                  os: ubuntu-22.04-arm
                - target: x86_64-apple-darwin
                  os: macos-15-intel
                - target: aarch64-apple-darwin
                  os: macos-latest
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v5
            - uses: arduino/setup-protoc@v3
              with:
                repo-token: ${{ secrets.GITHUB_TOKEN }}
            - name: Build release archive
              id: build
              uses: taiki-e/upload-rust-binary-action@v1
              with:
                bin: pathfinder
                target: ${{ matrix.target }}
                profile: release-lto
                # Build the archive without publishing it so smoke tests can run first.
                dry-run: true
                dry-run-intended: true
            - name: Store release archive
              uses: actions/upload-artifact@v7
              with:
                name: release-${{ matrix.target }}
                path: ${{ steps.build.outputs.tar }}
                if-no-files-found: error
                # Artifacts are only needed for the next job, so we can delete them after 1 day.
                retention-days: 1

    test-binaries:
        needs: build-binaries
        uses: ./.github/workflows/_test-binaries.yml
        with:
          release_tag: ${{ github.ref_name }}

    create-draft-release:
        needs: test-binaries
        runs-on: ubuntu-latest
        permissions:
          contents: write
        steps:
            - uses: actions/checkout@v5
            - uses: taiki-e/create-gh-release-action@v1
              with:
                changelog: CHANGELOG.md
                draft: true
                token: ${{ secrets.GITHUB_TOKEN }}

    upload-assets:
        needs: create-draft-release
        runs-on: ubuntu-latest
        permissions:
          contents: write
        steps:
            - name: Download tested archives
              uses: actions/download-artifact@v8
              with:
                pattern: release-*
                path: artifacts
                merge-multiple: true
            - name: Upload archives to draft release
              env:
                GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                GH_REPO: ${{ github.repository }}
              # `--clobber` is needed to overwrite the existing assets in the draft
              # release, which were uploaded by the `create-draft-release` job.
              run: gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
